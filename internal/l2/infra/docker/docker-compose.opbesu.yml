# Overlay: run the validator EL (rollup-boost L2_URL) as op-besu instead of op-reth.
# Overrides the validator-el-a/validator-el-b services in place  same ports, volumes and
# /config mount  so the validator-el-a/validator-el-b network aliases (rollup-boost
# L2_URL=http://validator-el-a:8551, op-node, batcher, op-succinct) all still resolve.
# Applied when l2.validator-el=op-besu (--validator-el op-besu). op-besu runs the full
# Isthmus schedule (Prague EVM, final EIP-7685, EIP-2935), matching stage.
# Requires a locally-built image tagged ${OP_BESU_IMAGE:-local/op-besu:dev}.
#
# P2P: op-besu joins the flashblocks trusted-peer mesh the same way op-reth does. It boots
# with the SAME deterministic node key as op-reth would (VALIDATOR_EL_{A,B}_P2P_SECRET_KEY_HEX),
# so its enode id equals VALIDATOR_EL_{A,B}_ENODE_PUBKEY  exactly the peer op-rbuilder dials
# (--trusted-peers=enode://${VALIDATOR_EL_A_ENODE_PUBKEY}@validator-el-a:30303). Discovery stays off
# (op-rbuilder dials in directly), mirroring op-reth's --disable-discovery. Without this
# op-rbuilder sits at 0 peers; canonical blocks still arrive over the Engine API either way.
#
# Engine JWT: op-reth/op-geth (and stage) enforce engine JWT (--authrpc.jwtsecret=/config/jwt.txt)
# and rollup-boost presents it (L2_JWT_PATH=/config/jwt.txt). op-besu is left with
# --engine-jwt-disabled because Besu REJECTS rollup-boost's engine tokens with HTTP 401 even given
# the same secret  Besu's engine-JWT validation is stricter than op-geth/op-reth, so block
# production stalls at block 0. The engine port is internal to the localnet-l2 network (never
# published), so disabling JWT is safe here. This is the one parameter that does NOT mirror stage
# and MUST be resolved before a rollup-boost + op-besu deployment that enforces JWT (e.g. stage-hoodi).

services:
  validator-el-a:
    # Container is named op-besu-a so `docker ps` / `make show-l2` show the real client,
    # while the validator-el-a service/alias stays stable for everything that targets it.
    container_name: op-besu-a
    image: ${OP_BESU_IMAGE:-local/op-besu:dev}
    environment:
      # Deterministic node key → op-besu enode id == VALIDATOR_EL_A_ENODE_PUBKEY (the peer
      # op-rbuilder dials). Written to a key file at boot; never used elsewhere.
      OP_BESU_NODE_KEY: "${VALIDATOR_EL_A_P2P_SECRET_KEY_HEX}"
    entrypoint: [ ]
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        printf '0x%s' "$$OP_BESU_NODE_KEY" > /tmp/op-besu-nodekey
        exec besu \
          --genesis-file=/config/genesis.json \
          --data-path=/opt/besu/data \
          --bonsai-historical-block-limit=100000 \
          --bonsai-trie-logs-pruning-window-size=120000 \
          --network-id=${ROLLUP_A_CHAIN_ID} \
          --rpc-http-enabled \
          --rpc-http-host=0.0.0.0 \
          --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN \
          --rpc-http-max-active-connections=2000 \
          --rpc-http-cors-origins='*' \
          --host-allowlist='*' \
          --engine-rpc-enabled \
          --engine-rpc-port=8551 \
          --engine-jwt-disabled \
          --engine-host-allowlist='*' \
          --rpc-ws-enabled \
          --rpc-ws-host=0.0.0.0 \
          --rpc-ws-port=8546 \
          --rpc-ws-api=ETH,NET,WEB3,DEBUG,TXPOOL \
          --metrics-enabled \
          --metrics-host=0.0.0.0 \
          --metrics-port=9898 \
          --nat-method=NONE \
          --p2p-enabled=true \
          --p2p-host=0.0.0.0 \
          --p2p-port=30303 \
          --discovery-enabled=false \
          --max-peers=10 \
          --node-private-key-file=/tmp/op-besu-nodekey

  # op-besu doesn't implement the reth/op-geth `miner_setMaxDASize` RPC that the
  # op-batcher's DA-throttling loop probes at startup; without it the batcher
  # logs "SetMaxDASize RPC method unavailable … shutting down" and stops, so no
  # batches reach L1 and the safe head never advances. Disable DA throttling
  # (Zero disables it) for op-besu runs. op-reth supports the method, so its
  # base-compose config keeps throttling enabled.
  op-batcher-a:
    environment:
      OP_BATCHER_THROTTLE_UNSAFE_DA_BYTES_LOWER_THRESHOLD: "0"
  op-batcher-b:
    environment:
      OP_BATCHER_THROTTLE_UNSAFE_DA_BYTES_LOWER_THRESHOLD: "0"

  validator-el-b:
    container_name: op-besu-b
    image: ${OP_BESU_IMAGE:-local/op-besu:dev}
    environment:
      OP_BESU_NODE_KEY: "${VALIDATOR_EL_B_P2P_SECRET_KEY_HEX}"
    entrypoint: [ ]
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        printf '0x%s' "$$OP_BESU_NODE_KEY" > /tmp/op-besu-nodekey
        exec besu \
          --genesis-file=/config/genesis.json \
          --data-path=/opt/besu/data \
          --bonsai-historical-block-limit=100000 \
          --bonsai-trie-logs-pruning-window-size=120000 \
          --network-id=${ROLLUP_B_CHAIN_ID} \
          --rpc-http-enabled \
          --rpc-http-host=0.0.0.0 \
          --rpc-http-port=8545 \
          --rpc-http-api=ETH,NET,WEB3,DEBUG,TXPOOL,ADMIN \
          --rpc-http-max-active-connections=2000 \
          --rpc-http-cors-origins='*' \
          --host-allowlist='*' \
          --engine-rpc-enabled \
          --engine-rpc-port=8551 \
          --engine-jwt-disabled \
          --engine-host-allowlist='*' \
          --rpc-ws-enabled \
          --rpc-ws-host=0.0.0.0 \
          --rpc-ws-port=8546 \
          --rpc-ws-api=ETH,NET,WEB3,DEBUG,TXPOOL \
          --metrics-enabled \
          --metrics-host=0.0.0.0 \
          --metrics-port=9898 \
          --nat-method=NONE \
          --p2p-enabled=true \
          --p2p-host=0.0.0.0 \
          --p2p-port=30303 \
          --discovery-enabled=false \
          --max-peers=10 \
          --node-private-key-file=/tmp/op-besu-nodekey
