services:
  publisher:
    build:
      context: ${PUBLISHER_PATH}
      dockerfile: Dockerfile
    image: local/publisher:dev
    container_name: publisher
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      SERVER_LISTEN_ADDR: ":8080"
      METRICS_ENABLED: "true"
      METRICS_PORT: "8081"
      LOG_LEVEL: "debug"
      LOG_PRETTY: "true"
      AUTH_ENABLED: "false"
      PROOFS_ENABLED: "false"
      PROOFS_REQUIRE_PROOF: "false"
      CONSENSUS_TIMEOUT: "20s"
      CONSENSUS_PERIOD_DURATION: "60s"
      CONSENSUS_PROOF_WINDOW: "600s"
      L1_RPC_ENDPOINT: "${L1_EL_URL}"
      L1_SUPERBLOCK_CONTRACT: "${SP_L1_SUPERBLOCK_CONTRACT}"
      L1_SHARED_PUBLISHER_PK_HEX: "${SP_L1_SHARED_PUBLISHER_PK_HEX:-${WALLET_PRIVATE_KEY}}"
      L1_FROM_ADDRESS: "${SP_L1_FROM_ADDRESS:-${WALLET_ADDRESS}}"
      L1_DISPUTE_GAME_FACTORY: "${SP_L1_DISPUTE_GAME_FACTORY}"
      L1_CHAIN_ID: "${L1_CHAIN_ID}"
      L1_ETHERA_NETWORK_NAME: "${ETHERA_NETWORK_NAME}"
      REGISTRY_PATH: "/workspace/.localnet/registry"  # Custom registry with local chain definitions
      SETTLEMENT_L1_RPC_URL: "${L1_EL_URL}"
      SETTLEMENT_L2OO_ADDRESS: "${SP_L1_SUPERBLOCK_CONTRACT}"
      SETTLEMENT_PROPOSER_KEY: "${SP_L1_SHARED_PUBLISHER_PK_HEX:-${WALLET_PRIVATE_KEY}}"
    volumes:
      - ${ROOT_DIR}/.localnet/registry:/workspace/.localnet/registry:ro
    ports:
      - "18080:8080"
      - "18081:8081"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8081/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  op-reth-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:${OP_RETH_IMAGE_TAG}
    container_name: op-reth-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      ROLLUP_CHAIN_ID: "${ROLLUP_A_CHAIN_ID}"
    volumes:
      - rollup-a-op-reth:/data
      - ${ROLLUP_A_CONFIG_PATH:-../../networks/rollup-a}:/config:ro
    ports:
      - "${ROLLUP_A_RPC_PORT}:8545"
      - "18546:8546"
      - "18551:8551"
      - "19898:9898"
    depends_on:
      - publisher
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8545" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    entrypoint: [ ]
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        if [ ! -f /data/db/database.version ]; then
          echo '[*] initializing op-reth datadir'
          op-reth init --datadir=/data --chain=/config/genesis.json
        fi

        echo "[*] Starting op-reth"

        exec op-reth node \
          --chain=/config/genesis.json \
          --datadir=/data \
          --http \
          --http.addr=0.0.0.0 \
          --http.port=8545 \
          --http.corsdomain='*' \
          --http.api=web3,debug,eth,txpool,net,miner \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=8546 \
          --ws.origins='*' \
          --ws.api=web3,debug,eth,txpool,net,miner \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port=8551 \
          --authrpc.jwtsecret=/config/jwt.txt \
          --disable-tx-gossip \
          --disable-discovery \
          --max-peers=10 \
          --port=30303 \
          --p2p-secret-key-hex=${RETH_A_P2P_SECRET_KEY_HEX} \
          --nat=none \
          --network-id=$${ROLLUP_CHAIN_ID} \
          --metrics=0.0.0.0:9898 \
          --rollup.compute-pending-block

  op-node-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:${OP_NODE_IMAGE_TAG}
    container_name: op-node-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      op-reth-a:
        condition: service_healthy
    environment:
      OP_NODE_L1_ETH_RPC: "${L1_EL_URL}"
      OP_NODE_L1_BEACON: "${L1_CL_URL}"
      OP_NODE_L2_ENGINE_RPC: "http://op-reth-a:8551"
      OP_NODE_L2_ENGINE_AUTH: "/config/jwt.txt"
      OP_NODE_L2_ENGINE_KIND: "reth"
      OP_NODE_ROLLUP_CONFIG: "/config/rollup.json"
      OP_NODE_ROLLUP_L1_CHAIN_CONFIG: "/config/l1-chainconfig.json"
      OP_NODE_P2P_DISABLE: "true"
      OP_NODE_SEQUENCER_ENABLED: "true"
      OP_NODE_SEQUENCER_L1_CONFS: "0"
      OP_NODE_VERIFIER_L1_CONFS: "0"
      OP_NODE_P2P_SEQUENCER_KEY: "${SEQUENCER_PRIVATE_KEY:-${WALLET_PRIVATE_KEY}}"
      OP_NODE_RPC_ADDR: "0.0.0.0"
      OP_NODE_RPC_PORT: "9545"
      OP_NODE_RPC_ENABLE_ADMIN: "true"
      OP_NODE_LOG_LEVEL: "info"
    volumes:
      - rollup-a-opnode:/data
      - ${ROLLUP_A_CONFIG_PATH:-../../networks/rollup-a}:/config:ro
    ports:
      - "19545:9545"

  op-batcher-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:${OP_BATCHER_IMAGE_TAG}
    container_name: op-batcher-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-node-a
    environment:
      OP_BATCHER_L1_ETH_RPC: "${L1_EL_URL}"
      OP_BATCHER_L2_ETH_RPC: "http://op-reth-a:8545"
      OP_BATCHER_ROLLUP_RPC: "http://op-node-a:9545"
      OP_BATCHER_PRIVATE_KEY: "${WALLET_PRIVATE_KEY}"
      OP_BATCHER_POLL_INTERVAL: "1s"
      OP_BATCHER_SUB_SAFETY_MARGIN: "6"
      OP_BATCHER_NUM_CONFIRMATIONS: "1"
      OP_BATCHER_MAX_CHANNEL_DURATION: "25"
      OP_BATCHER_RPC_ADDR: "0.0.0.0"
      OP_BATCHER_RPC_PORT: "8548"
      OP_BATCHER_RPC_ENABLE_ADMIN: "true"
    ports:
      - "18548:8548"

  op-proposer-a:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:${OP_PROPOSER_IMAGE_TAG}
    container_name: op-proposer-a
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-node-a
    env_file:
      - ${ROLLUP_A_CONFIG_PATH_CONTAINER:-../../networks/rollup-a}/runtime.env
    environment:
      OP_PROPOSER_L1_ETH_RPC: "${L1_EL_URL}"
      OP_PROPOSER_ROLLUP_RPC: "http://op-node-a:9545"
      OP_PROPOSER_PRIVATE_KEY: "${WALLET_PRIVATE_KEY}"
      OP_PROPOSER_POLL_INTERVAL: "12s"
      OP_PROPOSER_PROPOSAL_INTERVAL: "10m"
      OP_PROPOSER_GAME_TYPE: "1"
      OP_PROPOSER_RPC_PORT: "8560"
      OP_PROPOSER_RPC_ADDR: "0.0.0.0"
      OP_PROPOSER_RPC_ENABLE_ADMIN: "true"
    ports:
      - "18560:8560"

  op-reth-b:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:${OP_RETH_IMAGE_TAG}
    container_name: op-reth-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      ROLLUP_CHAIN_ID: "${ROLLUP_B_CHAIN_ID}"
    volumes:
      - rollup-b-op-reth:/data
      - ${ROLLUP_B_CONFIG_PATH:-../../networks/rollup-b}:/config:ro
    ports:
      - "${ROLLUP_B_RPC_PORT}:8545"
      - "28546:8546"
      - "28551:8551"
      - "29898:9898"
    depends_on:
      - publisher
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8545" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    entrypoint: [ ]
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        if [ ! -f /data/db/database.version ]; then
          echo '[*] initializing op-reth datadir'
          op-reth init --datadir=/data --chain=/config/genesis.json
        fi

        echo "[*] Starting op-reth"

        exec op-reth node \
          --chain=/config/genesis.json \
          --datadir=/data \
          --http \
          --http.addr=0.0.0.0 \
          --http.port=8545 \
          --http.corsdomain='*' \
          --http.api=web3,debug,eth,txpool,net,miner \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=8546 \
          --ws.origins='*' \
          --ws.api=web3,debug,eth,txpool,net,miner \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port=8551 \
          --authrpc.jwtsecret=/config/jwt.txt \
          --disable-tx-gossip \
          --disable-discovery \
          --max-peers=10 \
          --port=30303 \
          --p2p-secret-key-hex=${RETH_B_P2P_SECRET_KEY_HEX} \
          --nat=none \
          --network-id=$${ROLLUP_CHAIN_ID} \
          --metrics=0.0.0.0:9898 \
          --rollup.compute-pending-block

  op-node-b:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:${OP_NODE_IMAGE_TAG}
    container_name: op-node-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      op-reth-b:
        condition: service_healthy
    environment:
      OP_NODE_L1_ETH_RPC: "${L1_EL_URL}"
      OP_NODE_L1_BEACON: "${L1_CL_URL}"
      OP_NODE_L2_ENGINE_RPC: "http://op-reth-b:8551"
      OP_NODE_L2_ENGINE_AUTH: "/config/jwt.txt"
      OP_NODE_L2_ENGINE_KIND: "reth"
      OP_NODE_ROLLUP_CONFIG: "/config/rollup.json"
      OP_NODE_ROLLUP_L1_CHAIN_CONFIG: "/config/l1-chainconfig.json"
      OP_NODE_P2P_DISABLE: "true"
      OP_NODE_SEQUENCER_ENABLED: "true"
      OP_NODE_SEQUENCER_L1_CONFS: "0"
      OP_NODE_VERIFIER_L1_CONFS: "0"
      OP_NODE_P2P_SEQUENCER_KEY: "${SEQUENCER_PRIVATE_KEY:-${WALLET_PRIVATE_KEY}}"
      OP_NODE_RPC_ADDR: "0.0.0.0"
      OP_NODE_RPC_PORT: "9545"
      OP_NODE_RPC_ENABLE_ADMIN: "true"
      OP_NODE_LOG_LEVEL: "info"
    volumes:
      - rollup-b-opnode:/data
      - ${ROLLUP_B_CONFIG_PATH:-../../networks/rollup-b}:/config:ro
    ports:
      - "29545:9545"

  op-batcher-b:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:${OP_BATCHER_IMAGE_TAG}
    container_name: op-batcher-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-node-b
    environment:
      OP_BATCHER_L1_ETH_RPC: "${L1_EL_URL}"
      OP_BATCHER_L2_ETH_RPC: "http://op-reth-b:8545"
      OP_BATCHER_ROLLUP_RPC: "http://op-node-b:9545"
      OP_BATCHER_PRIVATE_KEY: "${WALLET_PRIVATE_KEY}"
      OP_BATCHER_POLL_INTERVAL: "1s"
      OP_BATCHER_SUB_SAFETY_MARGIN: "6"
      OP_BATCHER_NUM_CONFIRMATIONS: "1"
      OP_BATCHER_MAX_CHANNEL_DURATION: "25"
      OP_BATCHER_RPC_ADDR: "0.0.0.0"
      OP_BATCHER_RPC_PORT: "8548"
      OP_BATCHER_RPC_ENABLE_ADMIN: "true"
    ports:
      - "28548:8548"

  op-proposer-b:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:${OP_PROPOSER_IMAGE_TAG}
    container_name: op-proposer-b
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    depends_on:
      - op-node-b
    env_file:
      - ${ROLLUP_B_CONFIG_PATH_CONTAINER:-../../networks/rollup-b}/runtime.env
    environment:
      OP_PROPOSER_L1_ETH_RPC: "${L1_EL_URL}"
      OP_PROPOSER_ROLLUP_RPC: "http://op-node-b:9545"
      OP_PROPOSER_PRIVATE_KEY: "${WALLET_PRIVATE_KEY}"
      OP_PROPOSER_POLL_INTERVAL: "12s"
      OP_PROPOSER_PROPOSAL_INTERVAL: "10m"
      OP_PROPOSER_GAME_TYPE: "1"
      OP_PROPOSER_RPC_PORT: "8560"
      OP_PROPOSER_RPC_ADDR: "0.0.0.0"
      OP_PROPOSER_RPC_ENABLE_ADMIN: "true"
    ports:
      - "28560:8560"

  # Per-stack health probe. Reports the status of every other container in
  # the localnet-l2 stack to the Ethera Labs Console so the architecture
  # diagram can render live indicators for optional services.
  # The docker socket is bind-mounted read-only because the probe needs to
  # call `docker inspect` against sibling containers; no other docker
  # mutations are performed.
  localnet-health:
    build:
      context: ${ROOT_DIR}
      dockerfile: build/Dockerfile.health
    image: local/localnet-health:dev
    container_name: localnet-health
    labels:
      - "stack=localnet-l2"
    networks:
      - localnet-l2
    environment:
      HEALTH_API_PORT: "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${HEALTH_API_PORT:-8090}:8090"
    restart: unless-stopped

volumes:
  rollup-a-op-reth:
  rollup-b-op-reth:
  rollup-a-opnode:
  rollup-b-opnode:

networks:
  localnet-l2:
    driver: bridge
    name: localnet-l2
    labels:
      stack: localnet-l2
